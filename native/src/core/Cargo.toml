[package]
name = "magisk"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]
path = "lib.rs"

[features]
# CUSTOM BUILD: `check-signature` is intentionally removed from the defaults.
# With it enabled, magiskd compares the manager APK's signing certificate
# against the one baked into the daemon and, on mismatch, runs
# `pm_install /data/stub.apk` + `pm_uninstall com.topjohnwu.magisk`
# (see package.rs, Status::CertMismatch). A locally built APK can never carry
# the upstream certificate, so the flag must be off for this build.
# `check-client` and `su-check-db` are kept so su requests stay validated.
default = ["check-client", "su-check-db"]

# Disable these features for easier debugging during development
check-signature = []
check-client = []
su-check-db = []

[lints]
workspace = true

[build-dependencies]
cxx-gen = { workspace = true }
pb-rs = { workspace = true }

[dependencies]
base = { workspace = true, features = ["selinux"] }
cxx = { workspace = true }
num-traits = { workspace = true }
num-derive = { workspace = true }
quick-protobuf = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
bit-set = { workspace = true }
nix = { workspace = true, features = ["fs", "mount", "poll", "signal", "term", "user", "zerocopy"] }
bitflags = { workspace = true }
