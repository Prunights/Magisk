name: Magisk Build

# Custom build workflow for the OPPO Watch 2 (OW20W3).
#
# Differences from the upstream workflow:
#   * builds only the armeabi-v7a ABI (see .github/watch.prop)
#   * skips the debug build and all emulator / AVD test jobs, which are
#     irrelevant for a single-device custom build and only burn runner time
#   * publishes the release APK as a plain artifact so it can be downloaded
#     and installed directly on the watch

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
      - ".github/watch.prop"
  workflow_dispatch:

jobs:
  build:
    name: Build Magisk artifacts (armv7)
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build release
        run: ./build.py -vr -c .github/watch.prop all

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Collect outputs
        run: |
          mkdir -p artifacts
          ls -l out
          # The APK that gets installed on the watch
          cp out/*.apk artifacts/ 2>/dev/null || true
          cp app/apk/build/outputs/apk/release/*.apk artifacts/ 2>/dev/null || true
          ls -l artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: magisk-watch-armv7
          path: artifacts
          compression-level: 9
          if-no-files-found: error
